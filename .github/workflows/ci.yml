name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The daemon is Windows-first (path canonicalisation, device names, the
    # Scheduled Task installer), so the suite runs where it will be deployed.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
